memory_limit = 512M
max_input_vars = 5000
upload_max_filesize = 32M
post_max_size = 40M
max_execution_time = 120
date.timezone = UTC
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off
session.cookie_httponly = On
session.cookie_samesite = Lax
opcache.enable = On
opcache.validate_timestamps = Off
