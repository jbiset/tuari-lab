log_format tuari escape=json '{"timestamp":"$time_iso8601","source":"live",'
    '"client_ip":"$remote_addr","method":"$request_method","path":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"request_seconds":$request_time,'
    '"upstream_seconds":"$upstream_response_time"}';

server {
    listen 80;
    server_name _;
    client_max_body_size 40m;
    access_log /dev/stdout tuari;
    error_log /dev/stderr warn;
    location / {
        proxy_pass http://moodle:80;
        proxy_set_header Host moodle;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
